	</defs>
	<rect width="512" height="512" rx="116" fill="url(#bg)" />
	<!-- ears -->
	<ellipse cx="152" cy="150" rx="58" ry="68" fill="#8ed4c0" transform="rotate(-16 152 150)" />
	<ellipse cx="360" cy="150" rx="58" ry="68" fill="#8ed4c0" transform="rotate(16 360 150)" />
	<ellipse cx="154" cy="154" rx="32" ry="38" fill="#b6ebdd" transform="rotate(-16 154 154)" />
	<ellipse cx="358" cy="154" rx="32" ry="38" fill="#b6ebdd" transform="rotate(16 358 154)" />
